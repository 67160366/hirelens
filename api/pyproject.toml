[project]
name = "hirelens-api"
version = "0.1.0"
description = "Explainable resume screening — every AI claim traces back to a verbatim span in the source document"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pdfplumber>=0.11",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "google-genai>=1.0",
    "arq>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "reportlab>=4.2",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings — Thai text is expected here
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
# Import `app` from the source tree instead of installing the package editable.
# An editable install writes a .pth file holding the absolute project path, which
# Python reads using the system ANSI codepage — on a machine whose codepage is not
# UTF-8, a non-ASCII character in that path kills the interpreter at startup.
pythonpath = ["."]
