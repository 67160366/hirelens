name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      # Pinned to an exact release, not a floating major, because setup-uv stopped
      # publishing `@v8`/`@v9` on purpose: a moving major tag is what made the
      # tj-actions supply-chain attack possible. Its releases are immutable, so this
      # is the upstream-recommended form — and it is also the first major that runs
      # on Node 24, which `@v6` did not despite being the newest floating tag.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # `uv sync` builds its own venv (the runner's system Python is PEP 668
      # "externally managed", so a --system install is refused outright) and
      # --locked makes CI install exactly what uv.lock pins — the build fails
      # loudly if pyproject.toml and the lockfile have drifted apart.
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check app tests migrations

      - name: Format check
        run: ruff format --check app tests migrations

      - name: Type check
        run: mypy app

      # No database and no API key: the models render on SQLite via JSON_VARIANT and
      # the default extraction backend is the fixture-driven fake. CI never calls a
      # third-party API, so it cannot fail on someone else's outage or quota.
      - name: Test
        run: pytest -q

      - name: Verify migrations apply and reverse
        env:
          DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
        run: |
          mkdir -p var
          alembic upgrade head
          alembic downgrade base

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
