name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/pyproject.toml

      # The runner's system Python is PEP 668 "externally managed", so a
      # --system install is refused outright. Build a venv and put it on PATH
      # for the steps below, which also pins the interpreter to the version
      # development runs on rather than whatever the runner image ships.
      - name: Install dependencies
        run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests migrations

      - name: Format check
        run: ruff format --check app tests migrations

      - name: Type check
        run: mypy app

      # No database and no API key: the models render on SQLite via JSON_VARIANT and
      # the default extraction backend is the fixture-driven fake. CI never calls a
      # third-party API, so it cannot fail on someone else's outage or quota.
      - name: Test
        run: pytest -q

      - name: Verify migrations apply and reverse
        env:
          DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
        run: |
          mkdir -p var
          alembic upgrade head
          alembic downgrade base

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
